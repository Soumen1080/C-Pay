name: Feature Request
description: Suggest a new feature or improvement for C-Pay
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the problem and your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a frustration?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of C-Pay does this affect?
      options:
        - Mobile App (Onboarding/Auth)
        - Mobile App (Payments/Wallet)
        - Mobile App (Merchant)
        - Relayer Service
        - Soroban Contract
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: pilot
    attributes:
      label: Pilot vs Production
      description: Is this for the closed pilot or production readiness?
      options:
        - Closed pilot (testnet credits)
        - Production readiness
        - Both

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, mockups, or screenshots.
