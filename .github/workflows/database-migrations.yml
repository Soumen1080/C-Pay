name: Database migration replay

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/database/**"
      - ".github/workflows/database-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-replay:
    name: Fresh Supabase migration replay
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.84.2

      - name: Start from an empty Supabase database
        run: supabase start

      - name: Replay every migration from scratch
        run: supabase db reset --no-seed

      - name: Verify final database security invariants
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
