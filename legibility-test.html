<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-Pay Logo Legibility Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 40px;
            background: #f9fafb;
            color: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1200px;
            width: 100%;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
        }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            align-items: end;
            justify-items: center;
        }
        .test-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
        }
        .label {
            margin-top: 16px;
            font-size: 14px;
            color: #4b5563;
            font-weight: 500;
        }
        .logo-16 { width: 16px; height: 16px; }
        .logo-48 { width: 48px; height: 48px; }
        .logo-1024 { width: 1024px; height: 1024px; max-width: 100%; height: auto; }
        
        /* High contrast black and white test */
        .bw-test {
            margin-top: 60px;
            padding: 40px;
            background: #000;
            color: #fff;
            border-radius: 12px;
            text-align: center;
        }
        .bw-test img {
            filter: invert(1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>C-Pay Brand Mark Legibility Test</h1>
        
        <div class="test-grid">
            <div class="test-item">
                <img src="logo-master.svg" alt="C-Pay Logo 16px" class="logo-16">
                <div class="label">16px (Favicon / Micro-UI)</div>
            </div>
            
            <div class="test-item">
                <img src="logo-master.svg" alt="C-Pay Logo 48px" class="logo-48">
                <div class="label">48px (App Icon / Header)</div>
            </div>
            
            <div class="test-item" style="grid-column: 1 / -1;">
                <img src="logo-master.svg" alt="C-Pay Logo 1024px" class="logo-1024">
                <div class="label">1024px (Master / Print)</div>
            </div>
        </div>

        <div class="bw-test">
            <h2>Negative Contrast Test</h2>
            <p>Testing single color inversion for dark mode and monochrome printing.</p>
            <div style="margin-top: 30px; display: flex; justify-content: center; gap: 40px; align-items: flex-end;">
                <img src="logo-master.svg" alt="C-Pay Logo 16px" class="logo-16">
                <img src="logo-master.svg" alt="C-Pay Logo 48px" class="logo-48">
            </div>
        </div>
    </div>
</body>
</html>
